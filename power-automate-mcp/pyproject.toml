[project]
name = "power-automate-mcp"
version = "0.1.0"
description = "MCP server for managing Microsoft Power Automate (Flow) cloud flows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "msal>=1.28",
]

[project.scripts]
power-automate-mcp = "power_automate_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/power_automate_mcp"]
